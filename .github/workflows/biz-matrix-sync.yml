name: BizMatrix Sync + Pitch Deck Auto-Update

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run pitch deck patch (no file write)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  biz-matrix-sync:
    name: Sync BizMatrix KPIs
    runs-on: ubuntu-latest
    steps:
      - name: Invoke biz-matrix-sync Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "${SUPABASE_URL}/functions/v1/biz-matrix-sync" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 60)
          echo "Sync response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if not data.get('ok'):
              print('ERROR: sync reported failure', data)
              sys.exit(1)
          print('Sync OK -- snapshot_at:', data.get('snapshot_at'))
          for dest, status in data.get('destinations', {}).items():
              print(f'  {dest}: {status}')
          "

  pitch-deck-sync:
    name: Patch Pitch Deck
    runs-on: ubuntu-latest
    needs: biz-matrix-sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install python-pptx requests

      - name: Run pitch deck sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          DRY=${{ github.event.inputs.dry_run || 'false' }}
          FLAGS=""
          [ "$DRY" = "true" ] && FLAGS="--dry-run"
          python3 scripts/sync_pitch_deck.py \
            --deck assets/SouHimBouAI_PitchDeck_NouchiX.pptx \
            --out  assets/SouHimBouAI_PitchDeck_NouchiX_latest.pptx \
            $FLAGS

      - name: Commit updated deck
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/SouHimBouAI_PitchDeck_NouchiX_latest.pptx
          if git diff --cached --quiet; then
            echo "No deck changes to commit"
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "chore(deck): auto-sync pitch deck KPIs and narrative -- ${DATE}

BizMatrix sync + Brave ZDR narrative patches applied.
https://claude.ai/code/session_01AR3hTdNh6nubNaiwYofGjg"
            git push origin HEAD
          fi

  notify-slack:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [biz-matrix-sync, pitch-deck-sync]
    if: always()
    steps:
      - name: Post sync result to Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_BIZ_MATRIX_WEBHOOK }}
        run: |
          STATUS_MATRIX="${{ needs.biz-matrix-sync.result }}"
          STATUS_DECK="${{ needs.pitch-deck-sync.result }}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          MESSAGE="*NouchiX BizMatrix Daily Sync -- ${DATE}*\n* KPI sync: ${STATUS_MATRIX}\n* Pitch deck patch: ${STATUS_DECK}"
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST "$SLACK_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"${MESSAGE}\"}"
          else
            echo "SLACK_BIZ_MATRIX_WEBHOOK not set -- skipping"
          fi
