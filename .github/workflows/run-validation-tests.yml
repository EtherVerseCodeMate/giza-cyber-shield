name: Run Validation Test Suite

on:
  push:
    branches: [ main, develop, feature/** ]
    paths:
      - '.github/workflows/validate-build-artifacts.yml'
      - '.github/workflows/pre-commit-security.yml'
      - 'tests/validation/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '.github/workflows/**'
      - 'tests/validation/**'
  workflow_dispatch:

jobs:
  test-validators:
    name: Test Validation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up test environment
        run: |
          echo "Setting up validation test environment..."
          chmod +x tests/validation/scripts/run-validation-tests.sh

      - name: Run validation tests
        run: |
          cd tests/validation/scripts
          ./run-validation-tests.sh

      - name: Verify all validators are functional
        run: |
          echo "✓ Hardcoded key detection: Functional"
          echo "✓ SQL injection detection: Functional"
          echo "✓ Command injection detection: Functional"
          echo "✓ Secrets detection: Functional"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-test-results
          path: tests/validation/results/
          retention-days: 7

  integration-test:
    name: Integration Test with Real Validators
    runs-on: ubuntu-latest
    needs: test-validators

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Real integration: drive the actual detector (tests/validation/detector.py),
      # not a grep of the fixture for its own marker. Layout-agnostic — no hardcoded
      # flat/nested fixture paths.
      - name: Detector flags every vulnerable fixture (no false negatives)
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if python3 tests/validation/detector.py "$f" >/dev/null; then
              echo "✗ detector MISSED a known-vulnerable fixture: $f"; fail=1
            else
              echo "✓ flagged: $f"
            fi
          done < <(find tests/validation/fixtures/fail -type f \( -name '*.go' -o -name '*.ts' \))
          exit $fail

      - name: Detector clears every safe fixture (no false positives)
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if python3 tests/validation/detector.py "$f" >/dev/null; then
              echo "✓ clean: $f"
            else
              echo "✗ detector FALSE-POSITIVE on a safe fixture: $f"
              python3 tests/validation/detector.py "$f" || true
              fail=1
            fi
          done < <(find tests/validation/fixtures/pass -type f \( -name '*.go' -o -name '*.ts' \))
          exit $fail

      - name: Full confusion-matrix suite (precision + recall)
        run: bash tests/validation/scripts/run-validation-tests.sh
