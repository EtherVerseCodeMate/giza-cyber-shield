name: SAST + Secret Scan + Trivy (OWASP Verification)
# OWASP SDLC Phase: Verification
# Adds SAST (CodeQL), secret scanning (TruffleHog), and container CVE scanning (Trivy)
# to complement the existing supply-chain.yml (SBOM, SLSA, govulncheck, cosign).

on:
  push:
    branches: [main, "claude/**", "release/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"   # Weekly Monday 05:00 UTC
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. CodeQL SAST ───────────────────────────────────────────────────────────
  codeql:
    name: CodeQL — SAST (Go + TypeScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Go-specific: add extra security queries for crypto misuse
          config: |
            query-filters:
              - exclude:
                  tags contain: experimental

      - name: Setup Go (for Go matrix)
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true

  # ── 2. TruffleHog Secret Scanning ───────────────────────────────────────────
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog — detect verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── 3. Trivy — Container + Filesystem CVE Gate ───────────────────────────────
  trivy:
    name: Trivy — CVE Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Trivy — filesystem SCA (Go + npm + pip)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload FS SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-fs.sarif"
          category: "trivy-filesystem"

      - name: Setup Go (to build image)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build MCP server image for scanning
        run: docker build -t khepra-mcp-scan:${{ github.sha }} -f Dockerfile.mcp .

      - name: Trivy — Docker image CVE scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "khepra-mcp-scan:${{ github.sha }}"
          format: "sarif"
          output: "trivy-image.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image.sarif"
          category: "trivy-container"

      - name: Generate release SBOM (main branch)
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "khepra-mcp-scan:${{ github.sha }}"
          format: "cyclonedx"
          output: "trivy-sbom.cdx.json"

      - name: Upload Trivy SBOM artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sbom-${{ github.sha }}
          path: trivy-sbom.cdx.json
          retention-days: 90

  # ── 4. OWASP ZAP DAST (weekly, staging only) ─────────────────────────────────
  zap-dast:
    name: OWASP ZAP DAST — Staging API Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "https://staging.souhimbou.ai/api/health"
          rules_file_name: ".github/zap-rules.tsv"
          fail_action: false
          allow_issue_writing: true
          issue_title: "ZAP DAST — khepra-protocol Security Findings"

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report-${{ github.run_id }}
          path: |
            report_json.json
            report_html.html
          retention-days: 30
