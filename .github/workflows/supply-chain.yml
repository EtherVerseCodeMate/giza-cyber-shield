name: Supply Chain Security — SBOM + SLSA + AWS Marketplace

on:
  push:
    branches: [main, release/*]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write      # Required for SLSA GitHub Generator (OIDC) + ECR OIDC
  attestations: write  # Required for cosign image attestation

env:
  # Must satisfy the go.mod directive (go 1.26.4): cyclonedx-gomod invokes
  # `go list` against the hosted toolchain directly, so an older pin makes
  # the SBOM job fail with "failed to load modules".
  GO_VERSION: '1.26.4'
  # Resolve modules from the committed vendor/ tree. go.mod replaces
  # github.com/nouchix/PQC-Khepra-MCP with ../PQC-Khepra-MCP, which does not
  # exist in a single-repo CI checkout — any `go list` outside vendor mode
  # (e.g. inside cyclonedx-gomod) fails to load the module graph.
  GOFLAGS: '-mod=vendor'
  # GHCR (open-core community + Antigravity/Cline/Cursor distribution)
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/khepra-mcp
  # AWS ECR Public (AWS Marketplace GovCloud listing)
  # Overwrite in repo secrets for your account ID
  ECR_PUBLIC_REGISTRY: public.ecr.aws
  ECR_PUBLIC_IMAGE: public.ecr.aws/nouchix/khepra-mcp
  # AWS GovCloud ECR (DoD IL2-IL5 customers)
  # Set AWS_GOVCLOUD_ACCOUNT_ID and configure OIDC role in repo secrets
  ECR_GOVCLOUD_IMAGE: ${{ secrets.AWS_GOVCLOUD_ACCOUNT_ID }}.dkr.ecr.us-gov-west-1.amazonaws.com/nouchix/khepra-mcp

jobs:
  # ── Job 1: CycloneDX SBOM Generation ──────────────────────────────────────
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    outputs:
      sbom-artifact: sbom-cyclonedx.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true   # materialize embedded compliance CSVs (A-TD-01)

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest

      - name: Generate CycloneDX SBOM (JSON — AWS Marketplace + Iron Bank)
        run: |
          cyclonedx-gomod app \
            -main ./cmd/khepra-mcp \
            -output sbom-cyclonedx.json \
            -json \
            -licenses \
            -assert-licenses \
            -std

      - name: Generate CycloneDX SBOM (XML — DISA STIG tooling)
        run: |
          cyclonedx-gomod app \
            -main ./cmd/khepra-mcp \
            -output sbom-cyclonedx.xml \
            -licenses

      - name: Validate SBOM — check component count + license coverage
        run: |
          python3 -c "
          import json, sys
          with open('sbom-cyclonedx.json') as f:
            sbom = json.load(f)
          comps = sbom.get('components', [])
          print(f'SBOM: {len(comps)} components')
          no_license = [c['name'] for c in comps if not c.get('licenses')]
          if no_license:
            print(f'WARN: {len(no_license)} components missing license: {no_license[:5]}')
          sys.exit(0)
          "

      - name: Upload SBOM (90-day retention — C3PAO evidence)
        uses: actions/upload-artifact@v4
        with:
          name: khepra-sbom
          path: |
            sbom-cyclonedx.json
            sbom-cyclonedx.xml
          retention-days: 90

  # ── Job 2: Build Binary + OCI Image ───────────────────────────────────────
  build:
    name: Build + Push OCI Image
    runs-on: ubuntu-latest
    needs: sbom
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-uri: ${{ steps.build.outputs.imageid }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true   # materialize embedded compliance CSVs (A-TD-01)

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests (supply-chain confidence gate)
        run: go test ./pkg/mcp/... ./pkg/mcp/tools/... -race -timeout 120s

      - name: Build reproducible binary (verify vendored deps)
        run: |
          go mod verify
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build \
            -trimpath \
            -mod=vendor \
            -ldflags="-s -w \
              -X main.Version=$(git describe --tags --always) \
              -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
              -X main.Commit=${{ github.sha }}" \
            -o khepra-mcp-linux-amd64 \
            ./cmd/khepra-mcp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to AWS ECR Public (Marketplace)
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ECR_PUBLIC_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ECR_PUBLIC_SECRET }}

      - name: Login to AWS GovCloud ECR (DoD IL2-IL5)
        if: github.event_name != 'pull_request' && vars.AWS_GOVCLOUD_ENABLED == 'true'
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_REGION: us-gov-west-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_GOVCLOUD_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_GOVCLOUD_SECRET }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.ECR_PUBLIC_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=community,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=git-
          labels: |
            org.opencontainers.image.title=KHEPRA MCP Server
            org.opencontainers.image.description=Post-quantum MCP compliance server. CMMC L2 + STIG + NIST 800-171. Air-gappable. Zero token cost.
            io.modelcontextprotocol.server.name=io.github.etherversecodemate/khepra-mcp
            io.modelcontextprotocol.server.transport=stdio

      - name: Build and push — GHCR + ECR Public
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          # Fix Gap 3: use Dockerfile.mcp (Go 1.23, all 13 tools, mcp-runner binary)
          file: ./Dockerfile.mcp
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          sbom: true        # Attach CycloneDX SBOM to image manifest
          provenance: true  # Attach SLSA Build L3 provenance to image manifest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}

      - name: Tag + push GovCloud ECR (Enterprise / DoD SKU)
        if: github.event_name != 'pull_request' && vars.AWS_GOVCLOUD_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/')
        run: |
          # Re-tag the image for GovCloud ECR with tier labels
          docker buildx imagetools create \
            --tag ${{ env.ECR_GOVCLOUD_IMAGE }}:${{ github.ref_name }} \
            --tag ${{ env.ECR_GOVCLOUD_IMAGE }}:govcloud \
            ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: khepra-mcp-binary
          path: khepra-mcp-linux-amd64
          retention-days: 30

  # ── Job 3: SLSA Level 3 Provenance ────────────────────────────────────────
  slsa-provenance:
    name: SLSA Build L3 Provenance
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.image-digest }}
      provenance-name: khepra-mcp.intoto.jsonl
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}

  # ── Job 4: Cosign Keyless Signing (Sigstore) ──────────────────────────────
  cosign:
    name: Cosign Image Attestation
    runs-on: ubuntu-latest
    needs: [build, slsa-provenance]
    if: github.event_name != 'pull_request'

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign GHCR image (keyless — Sigstore OIDC)
        run: |
          cosign sign --yes \
            "${{ env.GHCR_IMAGE }}@${{ needs.build.outputs.image-digest }}"

      - name: Verify GHCR signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${{ env.GHCR_IMAGE }}@${{ needs.build.outputs.image-digest }}"

  # ── Job 5: Vulnerability Gate ─────────────────────────────────────────────
  vuln-gate:
    name: Supply Chain Vulnerability Gate
    runs-on: ubuntu-latest
    needs: sbom

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true   # materialize embedded compliance CSVs (A-TD-01)

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck (Go module vulnerability scan)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... 2>&1 | tee govulncheck-report.txt
          if grep -q "^Vulnerability #" govulncheck-report.txt; then
            echo "FAIL: govulncheck found vulnerabilities — block release"
            exit 1
          fi
          echo "PASS: no known Go module vulnerabilities"

      - name: Upload vuln report (90-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: govulncheck-report.txt
          retention-days: 90

  # ── Job 6: MCP Registry Submit (mcpservers.org + cline.bot) ───────────────
  # Fires only on tagged releases — submits the image manifest to MCP registries
  mcp-registry:
    name: MCP Registry Notification
    runs-on: ubuntu-latest
    needs: [build, cosign]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate MCP registry manifest
        run: |
          cat > mcp-registry-manifest.json << 'EOF'
          {
            "name": "io.github.etherversecodemate/khepra-mcp",
            "display_name": "KHEPRA MCP Server",
            "description": "Post-quantum MCP compliance server. CMMC Level 2, STIG, NIST 800-171. Air-gappable. ML-DSA-65 signed responses. Zero token cost.",
            "transport": "stdio",
            "version": "${{ github.ref_name }}",
            "image": "ghcr.io/${{ github.repository_owner }}/khepra-mcp:${{ github.ref_name }}",
            "digest": "${{ needs.build.outputs.image-digest }}",
            "tools": [
              "ert_scan", "godfather_report", "godfather_approve",
              "nist_map", "khepra_watch",
              "acp_status", "acp_issue", "acp_revoke",
              "nhi_inventory", "nhi_orphans", "nhi_excessive", "nhi_expired", "nhi_revoke"
            ],
            "categories": ["security", "compliance", "cmmc", "post-quantum", "stig", "air-gap"],
            "pricing": "community-free",
            "install": {
              "docker": "docker run --rm -i ghcr.io/${{ github.repository_owner }}/khepra-mcp:latest",
              "mcp_json": {
                "command": "docker",
                "args": ["run", "--rm", "-i", "ghcr.io/${{ github.repository_owner }}/khepra-mcp:latest"]
              }
            },
            "signature_scheme": "ML-DSA-65 (FIPS 204)",
            "air_gap_capable": true
          }
          EOF
          cat mcp-registry-manifest.json

      - name: Upload MCP registry manifest
        uses: actions/upload-artifact@v4
        with:
          name: mcp-registry-manifest
          path: mcp-registry-manifest.json
          retention-days: 365

      # Submit to mcpservers.org via their GitHub-based submission process
      # Manual step: copy the manifest above into a PR at github.com/modelcontextprotocol/servers
      - name: Print MCP Registry submission instructions
        run: |
          echo "=================================="
          echo "MCP REGISTRY SUBMISSION READY"
          echo "=================================="
          echo "Image: ghcr.io/${{ github.repository_owner }}/khepra-mcp:${{ github.ref_name }}"
          echo "Digest: ${{ needs.build.outputs.image-digest }}"
          echo ""
          echo "Submit to:"
          echo "  1. mcpservers.org  — PR to github.com/modelcontextprotocol/servers"
          echo "  2. cline.bot       — Add to marketplace.cline.bot"
          echo "  3. AWS Marketplace — Use mcp-registry-manifest.json artifact"
          echo ""
          echo "Add to .mcp.json for instant Cline/Cursor/Windsurf install:"
          echo '  {"mcpServers": {"khepra-mcp": {"command": "docker", "args": ["run", "--rm", "-i", "ghcr.io/${{ github.repository_owner }}/khepra-mcp:latest"]}}}'
