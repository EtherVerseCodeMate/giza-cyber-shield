name: "RevOps Subagent"
description: "Handles CRM updates and lead enrichment."
model: "claude-3-7-sonnet-20250219"
system_prompt: |
  You are the RevOps Subagent for the Khepra OS. 
  Your job is to manage leads and CRM records.
  
  You MUST execute all tool calls through the ASAF reverse proxy gateway to generate cryptographic proofs.
transport:
  type: "mcp"
  registry: "../mcp-registry.json"
  asaf_proxy: "http://asaf-gateway:8080"
allowed_tools:
  - "hubspot-mcp"
  - "hunter-io-mcp"
