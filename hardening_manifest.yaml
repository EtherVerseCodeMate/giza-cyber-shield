apiVersion: v1
name: "adinkhepra-asaf"

# ─────────────────────────────────────────────────────────────────────────────
# AdinKhepra ASAF — Agentic Security Attestation Framework
# Iron Bank Hardening Manifest
# DoD Platform One / P1 Registry: registry1.dso.mil/nouchix/adinkhepra-asaf
# ─────────────────────────────────────────────────────────────────────────────

tags:
  - "1.0.1"
  - "1.0"
  - "latest"

labels:
  org.opencontainers.image.title: "AdinKhepra ASAF"
  org.opencontainers.image.description: >
    Agentic Security Attestation Framework — AI-powered CMMC/NIST 800-171/STIG
    compliance scanning with post-quantum DAG anchoring (ML-DSA-65, ML-KEM-1024).
    Sovereign air-gap mode. FIPS 140-3 (BoringCrypto) validated transport.
  org.opencontainers.image.vendor: "NouchiX / SecRed Knowledge Inc."
  org.opencontainers.image.version: "1.0.1"
  org.opencontainers.image.licenses: "Proprietary"
  org.opencontainers.image.url: "https://nouchix.com"
  org.opencontainers.image.source: "https://github.com/nouchix/adinkhepra-asaf-ironbank"
  org.opencontainers.image.documentation: "https://docs.nouchix.com"
  mil.dso.ironbank.image.keywords: >
    cmmc, nist-800-171, stig, post-quantum-cryptography, fips-140-3,
    compliance-automation, dag-audit-trail, zero-trust, air-gap
  mil.dso.ironbank.image.type: "Commercial"
  mil.dso.ironbank.product.name: "AdinKhepra ASAF"
  mil.dso.ironbank.product.version: "1.0.1"

args:
  BASE_IMAGE: "registry1.dso.mil/ironbank/redhat/ubi/ubi9-minimal:9.3"
  GO_VERSION: "1.22"
  GOEXPERIMENT: "boringcrypto"
  CGO_ENABLED: "1"
  GOFLAGS: "-mod=vendor"
  APP_USER: "asaf"
  APP_UID: "1001"
  APP_GID: "0"

# All Go dependencies are vendored. No network calls during build.
resources: []

# ── DATA CLASSIFICATION — IL2 Iron Bank Declaration ──────────────────────────
#
# This container image and its source code contain:
#
#   CUI (Controlled Unclassified Information)  : NO
#   ITAR-controlled technical data             : NO
#   Classified information (any level)         : NO
#   Real secrets or credentials                : NO
#   Export-controlled source code              : NO
#
# The source repository contains ONLY:
#   - Synthetic PQC test keys in test-fixtures/pqc-test-keys/ (test vectors only,
#     generated by the crypto test suite, not connected to any system)
#   - A public Cloudflare CA certificate in certs/ (publicly available, not secret)
#   - Cultural/project lore in docs/project-lore/ (no operational content)
#   - Code that SCANS FOR and DETECTS CUI/ITAR — does NOT CONTAIN CUI/ITAR
#
# AdinKhepra ASAF is a compliance tool. It helps operators achieve CMMC/NIST
# compliance. It does not process, store, or transmit classified data.
# ─────────────────────────────────────────────────────────────────────────────

security:
  fips_140_3: true
  non_root_user: true
  non_root_uid: 1001
  read_only_root_filesystem: true
  privileged: false
  capabilities_drop:
    - ALL
  capabilities_add: []
  host_network: false
  seccomp_profile: "runtime/default"

stig_findings:
  # RHEL-09-STIG-V1R3 applied via UBI9-minimal base
  # Full compliance matrix: docs/TC-25-ADINKHEPRA-001.md
  open_findings: []
  accepted_findings: []

cve_findings:
  critical: 0
  high: 0
  medium: []

milestones:
  - "1.0.0:  Initial Iron Bank submission — CMMC L2 + FIPS 140-3 + PQC"
  - "1.0.1:  File naming compliance (misleading names corrected per Iron Bank review)"
  - "1.1.0:  TPM/HSM integration — hardware root of trust (Q3 2026)"
  - "1.2.0:  Known Answer Tests (KATs) for FIPS crypto self-tests (Q4 2026)"
  - "1.3.0:  NIAP Protection Profile alignment — FDE PP v2.0 (Q1 2027)"

maintainers:
  - name: "Souhimbou D. Kone"
    username: "SouHimBou"
    email: "cyber@nouchix.com"
  - name: "NouchiX Security Team"
    email: "security@nouchix.com"

# ── GOVERNMENT POC (REQUIRED FOR RE-ONBOARDING) ──────────────────────────────
# Per Jeff Goluba (jeffrey.goluba@omnifederal.com) 2026-01-12:
# A government POC who is an active ASAF customer must approve resubmission.
# Status: PENDING — contact security@nouchix.com to be listed.
government_poc:
  name: "TBD"
  organization: "TBD"
  email: "TBD"
  approval_status: "PENDING"

storage:
  type: "PersistentVolumeClaim"
  size: "10Gi"
  access_mode: "ReadWriteOnce"
  mount_path: "/var/lib/adinkhepra/data"
  env_var: "ADINKHEPRA_STORAGE_PATH"

ports:
  - name: "asaf-api"
    port: 45444
    protocol: TCP
    description: "ASAF Watch API + NLP Dashboard (sovereign/air-gap mode)"
  - name: "healthz"
    port: 45444
    path: "/healthz"
    description: "Kubernetes liveness/readiness probe"

env:
  required:
    - name: "ADINKHEPRA_STORAGE_PATH"
      description: "Persistent storage path for DAG (K8s PVC mount point)"
      example: "/var/lib/adinkhepra/data"
  optional:
    - name: "ADINKHEPRA_FIPS_MODE"
      description: "Set to 'required' to hard-fail if BoringCrypto not active"
      default: "preferred"
    - name: "OLLAMA_BASE_URL"
      description: "Local Ollama LLM endpoint (sovereign AI, default: localhost:11434)"
      default: "http://localhost:11434"
  # Explicit declaration for IL2 reviewers:
  cloud_credentials_required: false
  openrouter_api_key_required: false
  supabase_required: false
  external_network_required: false
